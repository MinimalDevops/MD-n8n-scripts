services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8082}:8080"
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:${SEARXNG_PORT:-8082}/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Copy .env.example to .env and set SEARXNG_SECRET}"
      SEARXNG_PORT: "8080"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_LIMITER: "false"
      SEARXNG_IMAGE_PROXY: "false"
      SEARXNG_VALKEY_URL: "valkey://valkey:6379/0"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy=off http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey-data:
